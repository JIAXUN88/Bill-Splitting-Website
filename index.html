        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;

    <script type="module" crossorigin src="/Bill-Splitting-Website/assets/index-DZaamONS.js"></script>
    <link rel="stylesheet" crossorigin href="/Bill-Splitting-Website/assets/index-COGah8g6.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="survey-container"></div>
    <script type="text/javascript">
      function initSurvey() {
        const finalId = (typeof clarity !== 'undefined' && clarity.version) 
          ? (clarity("get", "userId") || `not-found-${Date.now()}`) 
          : `local-${Date.now()}`;
          
        const container = document.getElementById('survey-container');
        if (container) {
          const ifr = document.createElement('iframe');
          ifr.src = `https://docs.google.com/forms/d/e/1FAIpQLSeTkMoVyPIz2sGODNV0vfdxxr-LLH5MlusY9yBbI1vopt0cQg/viewform?usp=pp_url&entry.266927383=${finalId}`;
          ifr.width = "640";
          ifr.height = "800";
          ifr.frameBorder = "0";
          container.appendChild(ifr);
        }
      }
      // 確保網頁與 Clarity 準備就緒後執行
      window.addEventListener('load', () => setTimeout(initSurvey, 500));
    </script>
    <script type="text/javascript">
      // 請確保您的 FAB 按鈕帶有 id="my-fab" 
      window.addEventListener('scroll', () => {
        const fabButton = document.getElementById('my-fab');
        const googleSurvey = document.getElementById('survey-container');
        
        if (fabButton && googleSurvey) {
          const surveyTop = googleSurvey.getBoundingClientRect().top;
          const windowHeight = window.innerHeight;
          
          // 當 Google 表單頂端進入螢幕視野時，直接將按鈕隱藏 (none)
          if (surveyTop <= windowHeight - 100) { 
            fabButton.style.display = 'none';
          } else {
            // 滾動回網頁上方時，重新顯示按鈕
            fabButton.style.display = fabButton.classList.contains('flex') ? 'flex' : 'block';
          }
        }
      });
    </script>
  </body>
