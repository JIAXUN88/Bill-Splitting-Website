<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nagomi Ledger</title>
    <meta name="description" content="A serene, mindful group ledger and dashboard designed to simplify joint expenses with elegant Japanese aesthetics." />
    <meta property="og:title" content="Nagomi Ledger" />

    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "yqukj41wbw");

  </head>
  <body>
    <div id="root"></div>
    <div id="survey-container"></div>
    <script type="text/javascript">
      function initSurvey() {
        const finalId = (typeof clarity !== 'undefined' && clarity.version) 
          ? (clarity("get", "userId") || `not-found-${Date.now()}`) 
          : `local-${Date.now()}`;
          
        const container = document.getElementById('survey-container');
        if (container) {
          const ifr = document.createElement('iframe');
          ifr.src = `https://docs.google.com/forms/d/e/1FAIpQLSeTkMoVyPIz2sGODNV0vfdxxr-LLH5MlusY9yBbI1vopt0cQg/viewform?usp=pp_url&entry.266927383=${finalId}`;
          ifr.width = "640";
          ifr.height = "800";
          ifr.frameBorder = "0";
          container.appendChild(ifr);
        }
      }
      // 確保網頁與 Clarity 準備就緒後執行
      window.addEventListener('load', () => setTimeout(initSurvey, 500));
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
